<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Log</title>
<style>
/* ---- Leaflet core styles (inlined) ---- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-tile::selection{background:transparent}
.leaflet-safari .leaflet-tile{image-rendering:-webkit-optimize-contrast}
.leaflet-safari .leaflet-tile-container{width:1600px;height:1600px;-webkit-transform-origin:0 0}
.leaflet-marker-icon,.leaflet-marker-shadow{display:block}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-shadow-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container img.leaflet-tile{mix-blend-mode:plus-lighter}
.leaflet-container.leaflet-touch-zoom{-ms-touch-action:pan-x pan-y;touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{-ms-touch-action:pinch-zoom;touch-action:none;touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{-ms-touch-action:none;touch-action:none}
.leaflet-container{-webkit-tap-highlight-color:transparent}
.leaflet-container a{-webkit-tap-highlight-color:rgba(51,181,229,.4)}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800}
.leaflet-overlay-pane svg{-moz-user-select:none}
.leaflet-pane{z-index:400}
.leaflet-tile-pane{z-index:200}
.leaflet-overlay-pane{z-index:400}
.leaflet-shadow-pane{z-index:500}
.leaflet-marker-pane{z-index:600}
.leaflet-tooltip-pane{z-index:650}
.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}
.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{float:left;clear:both}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}
.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.leaflet-zoom-animated{transform-origin:0 0}
svg.leaflet-zoom-animated{will-change:transform}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}
.leaflet-crosshair,.leaflet-crosshair .leaflet-interactive{cursor:crosshair}
.leaflet-popup-pane,.leaflet-control{cursor:auto}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive,.leaflet-dragging .leaflet-marker-draggable{cursor:grabbing}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive,svg.leaflet-image-layer.leaflet-interactive path{pointer-events:auto}
.leaflet-container{background:#ddd;outline-offset:1px}
.leaflet-container a{color:#0078A8}
.leaflet-zoom-box{border:2px dotted #38f;background:rgba(255,255,255,.5)}
.leaflet-container{font-family:"Helvetica Neue",Arial,Helvetica,sans-serif;font-size:.75rem;line-height:1.5}
.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.65);border-radius:4px}
.leaflet-bar a{background-color:#fff;border-bottom:1px solid #ccc;width:26px;height:26px;line-height:26px;display:block;text-align:center;text-decoration:none;color:#000}
.leaflet-bar a,.leaflet-control-layers-toggle{background-position:50% 50%;background-repeat:no-repeat;display:block}
.leaflet-bar a:hover,.leaflet-bar a:focus{background-color:#f4f4f4}
.leaflet-bar a:first-child{border-top-left-radius:4px;border-top-right-radius:4px}
.leaflet-bar a:last-child{border-bottom-left-radius:4px;border-bottom-right-radius:4px;border-bottom:none}
.leaflet-bar a.leaflet-disabled{cursor:default;background-color:#f4f4f4;color:#bbb}
.leaflet-control-zoom-in,.leaflet-control-zoom-out{font:bold 18px 'Lucida Console',Monaco,monospace;text-indent:1px}
.leaflet-control-attribution{background:rgba(255,255,255,.8);margin:0;padding:0 5px;color:#333;line-height:1.4;font-size:10px}
.leaflet-control-attribution a{text-decoration:none}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:12px}
.leaflet-popup-content{margin:13px 24px 13px 20px;line-height:1.3;font-size:13px;min-height:1px}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;pointer-events:auto;transform:rotate(45deg)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#fff;color:#333;box-shadow:0 3px 14px rgba(0,0,0,.4)}
.leaflet-container a.leaflet-popup-close-button{position:absolute;top:0;right:0;border:none;text-align:center;width:24px;height:24px;font:16px/24px Tahoma,Verdana,sans-serif;color:#757575;text-decoration:none;background:transparent}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --panel-hover: #f5f7f9;
    --line: #dbe1e7;
    --text: #1c232b;
    --text-dim: #64707b;
    --accent: #c98a3e;
    --accent-dim: rgba(201, 138, 62, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.55;
  }

  .mono {
    font-family: ui-monospace, "SFMono-Regular", "Consolas", "Menlo", monospace;
  }

  .layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */

  .sidebar {
    border-right: 1px solid var(--line);
    padding: 28px 18px;
    position: sticky;
    top: 0;
    align-self: start;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-head h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; margin: 0 0 3px; }
  .sidebar-head .count { color: var(--text-dim); font-size: 0.8rem; margin: 0 0 18px; }

  .flightpath { width: 100%; height: 10px; margin-bottom: 20px; }

  .search-wrap { margin-bottom: 20px; }
  .search-wrap input {
    width: 100%; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); padding: 7px 10px; font-size: 0.85rem; border-radius: 3px;
  }
  .search-wrap input:focus { outline: none; border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--text-dim); }

  .month-label {
    font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.06em; padding: 14px 10px 6px;
  }

  .nav-list { list-style: none; margin: 0; padding: 0; }
  .nav-list a, .nav-link {
    display: block; padding: 7px 10px; margin-bottom: 1px; border-radius: 3px;
    color: var(--text-dim); text-decoration: none; font-size: 0.87rem;
    border-left: 2px solid transparent; transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .nav-link:hover { background: var(--panel); color: var(--text); }
  .nav-link.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-dim); }

  .no-results { color: var(--text-dim); font-size: 0.84rem; padding: 10px; display: none; }

  .mobile-nav { display: none; }

  /* ---------- Main ---------- */

  main { padding: 44px 44px 96px; max-width: 900px; }

  .month-divider {
    font-size: 0.78rem; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.06em; margin: 0 0 20px; padding-top: 8px;
  }

  .entry {
    padding-bottom: 44px; margin-bottom: 44px; border-bottom: 1px solid var(--line);
    scroll-margin-top: 24px;
  }
  .entry:last-child { border-bottom: none; }
  .entry.placeholder { opacity: 0.7; }

  .entry-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
  }

  .entry-date-input {
    background: transparent; border: none; border-bottom: 1px dashed var(--line);
    color: var(--accent); font-size: 1.05rem; padding: 2px 2px; cursor: text;
    font-family: ui-monospace, "SFMono-Regular", "Consolas", "Menlo", monospace;
  }
  .entry-date-input:focus { outline: none; border-bottom-color: var(--accent); }
  .entry-date-input:hover { border-bottom-color: var(--accent); }

  .edit-hint { font-size: 0.72rem; color: var(--text-dim); }

  .placeholder-tag {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-dim); border: 1px solid var(--line); padding: 2px 8px; border-radius: 20px;
  }

  .map-btn {
    margin-left: auto;
    font-size: 0.78rem;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    cursor: pointer;
  }
  .map-btn:hover { background: rgba(201, 138, 62, 0.24); }
  .map-btn input[type="file"] { display: none; }

  .map-status {
    font-size: 0.76rem;
    color: var(--text-dim);
    margin: 4px 0 0;
  }

  .flight-map {
    display: none;
    width: 100%;
    height: 320px;
    margin: 12px 0 18px;
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  .clip-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }

  .clip {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .clip-label {
    font-size: 0.68rem;
    color: var(--text-dim);
    text-align: center;
  }

  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    background: var(--panel);
    transition: border-color 0.15s, transform 0.15s;
  }
  .thumb:hover { border-color: #4a5562; transform: translateY(-2px); }

  .thumb img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }

  .thumb .play-icon {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,0.45); border: 1px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .thumb .play-icon svg { width: 9px; height: 9px; fill: var(--accent); margin-left: 1px; }

  .thumb.empty {
    display: flex; align-items: center; justify-content: center;
    border-style: dashed; cursor: default;
    color: var(--text-dim); font-size: 0.68rem; text-align: center; padding: 6px;
  }
  .thumb.empty:hover { transform: none; border-color: var(--line); }

  .notes {
    padding: 12px 14px; background: var(--panel); border-left: 2px solid var(--accent);
    font-size: 0.92rem; border-radius: 0 3px 3px 0;
  }
  .notes .notes-label {
    display: block; font-size: 0.72rem; color: var(--text-dim); margin-bottom: 5px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .notes p { margin: 0; }

  footer { color: var(--text-dim); font-size: 0.82rem; padding: 0 44px 48px; }

  /* ---------- Lightbox ---------- */

  .lightbox {
    display: none;
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 50; align-items: center; justify-content: center; padding: 40px;
  }
  .lightbox.open { display: flex; }
  .lightbox-inner {
    width: 100%; max-width: 900px; aspect-ratio: 16 / 9; position: relative;
  }
  .lightbox-inner iframe { width: 100%; height: 100%; border: 0; }
  .lightbox-close {
    position: absolute; top: -36px; right: 0; color: var(--text);
    background: none; border: none; font-size: 1.4rem; cursor: pointer; line-height: 1;
  }

  @media (max-width: 720px) {
    .layout { display: block; }
    .sidebar { display: none; }
    .mobile-nav {
      display: block; position: sticky; top: 0; z-index: 5;
      background: var(--bg); border-bottom: 1px solid var(--line); padding: 14px 20px;
    }
    .mobile-nav h1 { font-size: 1.05rem; margin: 0 0 10px; }
    .mobile-nav select {
      width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line);
      padding: 8px 10px; font-size: 0.85rem; border-radius: 3px;
    }
    main { padding: 28px 20px 72px; max-width: none; }
    footer { padding: 0 20px 48px; }
    .clip-grid { grid-template-columns: repeat(2, 1fr); }
    .lightbox { padding: 16px; }
  }
</style>
</head>
<body>

<div class="mobile-nav">
  <h1 class="mono">Flight Log</h1>
  <select id="jumpSelect" onchange="location.hash=this.value;"></select>
</div>

<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-head">
      <h1 class="mono">Flight Log</h1>
      <p class="count" id="entryCount"></p>
    </div>

    <svg class="flightpath" viewBox="0 0 200 10" preserveAspectRatio="none">
      <line x1="0" y1="5" x2="200" y2="5" stroke="#c3cdd6" stroke-width="1" stroke-dasharray="1,5" stroke-linecap="round"/>
    </svg>

    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Filter by date or note…">
    </div>

    <div id="navGroups"></div>
    <p class="no-results" id="noResults">No matching flights.</p>
  </nav>

  <main id="entries"></main>
</div>

<footer id="footer"></footer>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <iframe id="lightboxFrame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>
</div>

<script>
  /* ============================================================
     FLIGHT DATA
     Each entry needs a permanent "id" (never change this once
     set — it's how edited dates are remembered) and a "date"
     (ISO format YYYY-MM-DD, just a starting value — you can edit
     the date directly on the page afterward).

     "clips" holds up to 4 videos: {label, videoId}. videoId is
     the part after youtu.be/ in the video's link. Leave clips
     out or use fewer than 4 — empty slots just show as "add clip".

     Add a new flight by copying one of these objects and giving
     it a new unique id.
     ============================================================ */
  const entries = [
    {
      id: "flight-2026-09-05",
      date: "2026-09-05",
      clips: [
        { label: "Hi-res", videoId: "50_VUum5qNc" },
        { label: "Controller", videoId: "E3q3FVHYNBA" }
      ],
      notes: "Write your comments about this flight here."
    },
    {
      id: "flight-placeholder-1",
      date: "2026-09-12",
      clips: [],
      placeholder: true,
      notes: "Placeholder for your next flight. Edit the date above, replace the clip slots with real videoIds in the code, and rewrite this note — or delete this whole entry."
    }
  ];

  const DATE_KEY = id => `flightlog-date-${id}`;

  function getDate(entry) {
    try {
      return localStorage.getItem(DATE_KEY(entry.id)) || entry.date;
    } catch (e) {
      return entry.date;
    }
  }

  function setDate(entry, newDate) {
    try {
      localStorage.setItem(DATE_KEY(entry.id), newDate);
    } catch (e) { /* storage unavailable, edit won't persist */ }
    render();
  }

  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function parseDate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function displayLabel(iso) {
    const dt = parseDate(iso);
    return `${monthNames[dt.getMonth()].slice(0,3)} ${dt.getDate()}, ${dt.getFullYear()}`;
  }

  function monthKey(iso) {
    const dt = parseDate(iso);
    return `${monthNames[dt.getMonth()]} ${dt.getFullYear()}`;
  }

  const playIcon = `<svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>`;

  function thumbHtml(clip) {
    if (!clip) {
      return `<div class="thumb empty">+ add clip</div>`;
    }
    return `<div class="thumb" onclick="openLightbox('${clip.videoId}')">
      <img src="https://img.youtube.com/vi/${clip.videoId}/mqdefault.jpg" alt="${clip.label} thumbnail" loading="lazy">
      <div class="play-icon">${playIcon}</div>
    </div>`;
  }

  function openLightbox(videoId) {
    document.getElementById("lightboxFrame").src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
    document.getElementById("lightbox").classList.add("open");
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("open");
    document.getElementById("lightboxFrame").src = "";
  }

  document.getElementById("lightbox").addEventListener("click", (e) => {
    if (e.target.id === "lightbox") closeLightbox();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeLightbox();
  });

  function render() {
    const withDates = entries.map(e => ({ entry: e, date: getDate(e) }));
    withDates.sort((a, b) => b.date.localeCompare(a.date));

    const navGroups = document.getElementById("navGroups");
    const entriesEl = document.getElementById("entries");
    const jumpSelect = document.getElementById("jumpSelect");
    const footerEl = document.getElementById("footer");
    const entryCountEl = document.getElementById("entryCount");

    navGroups.innerHTML = "";
    entriesEl.innerHTML = "";
    jumpSelect.innerHTML = "";

    const realCount = entries.filter(e => !e.placeholder).length;
    entryCountEl.textContent = `${realCount} logged flight${realCount === 1 ? "" : "s"}`;
    footerEl.textContent = `Flight Log — ${realCount} ${realCount === 1 ? "entry" : "entries"}`;

    let lastMonth = null;
    let mainLastMonth = null;

    withDates.forEach(({ entry, date }) => {
      const mKey = monthKey(date);
      const label = displayLabel(date);

      if (mKey !== lastMonth) {
        navGroups.insertAdjacentHTML("beforeend", `<div class="month-label">${mKey}</div>`);
        lastMonth = mKey;
      }
      navGroups.insertAdjacentHTML("beforeend",
        `<a href="#${entry.id}" class="nav-link" data-date="${label.toLowerCase()}" data-notes="${entry.notes.toLowerCase().replace(/"/g,'&quot;')}">${label}${entry.placeholder ? " (placeholder)" : ""}</a>`);

      jumpSelect.insertAdjacentHTML("beforeend", `<option value="${entry.id}">${label}</option>`);

      if (mKey !== mainLastMonth) {
        entriesEl.insertAdjacentHTML("beforeend", `<p class="month-divider">${mKey}</p>`);
        mainLastMonth = mKey;
      }

      const clipSlots = [0, 1, 2, 3].map(i => entry.clips[i] || null);

      entriesEl.insertAdjacentHTML("beforeend", `
        <div class="entry ${entry.placeholder ? "placeholder" : ""}" id="${entry.id}">
          <div class="entry-head">
            <input class="entry-date-input mono" type="date" value="${date}" data-id="${entry.id}">
            <span class="edit-hint">click to edit date</span>
            ${entry.placeholder ? `<span class="placeholder-tag">placeholder</span>` : ""}
            <label class="map-btn">
              Load flight path (.srt)
              <input type="file" accept=".srt" onchange="handleSrtUpload(this, '${entry.id}')">
            </label>
          </div>
          <p class="map-status" id="mapstatus-${entry.id}"></p>
          <div class="flight-map" id="map-${entry.id}"></div>
          <div class="clip-grid">
            ${clipSlots.map(c => `
              <div class="clip">
                ${thumbHtml(c)}
                <p class="clip-label">${c ? c.label : ""}</p>
              </div>
            `).join("")}
          </div>
          <div class="notes">
            <span class="notes-label">Notes</span>
            <p>${entry.notes}</p>
          </div>
        </div>
      `);
    });

    // Wire up date inputs
    entriesEl.querySelectorAll(".entry-date-input").forEach(input => {
      input.addEventListener("change", () => {
        const entry = entries.find(e => e.id === input.dataset.id);
        if (entry) setDate(entry, input.value);
      });
    });

    // Active link highlight on scroll
    const links = Array.from(navGroups.querySelectorAll(".nav-link"));
    const sections = withDates.map(w => document.getElementById(w.entry.id));

    const observer = new IntersectionObserver((observed) => {
      observed.forEach(item => {
        if (item.isIntersecting) {
          const idx = sections.indexOf(item.target);
          links.forEach(l => l.classList.remove("active"));
          if (idx > -1 && links[idx]) links[idx].classList.add("active");
        }
      });
    }, { rootMargin: "-20% 0px -70% 0px" });

    sections.forEach(s => s && observer.observe(s));
    if (links[0]) links[0].classList.add("active");

    // Search filter re-bind
    const searchInput = document.getElementById("searchInput");
    const noResults = document.getElementById("noResults");

    function applyFilter() {
      const q = searchInput.value.trim().toLowerCase();
      let anyVisible = false;
      links.forEach(l => {
        const match = l.dataset.date.includes(q) || l.dataset.notes.includes(q);
        l.style.display = match ? "" : "none";
        if (match) anyVisible = true;
      });
      Array.from(navGroups.querySelectorAll(".month-label")).forEach(labelEl => {
        let el = labelEl.nextElementSibling;
        let hasVisible = false;
        while (el && !el.classList.contains("month-label")) {
          if (el.style.display !== "none") hasVisible = true;
          el = el.nextElementSibling;
        }
        labelEl.style.display = hasVisible ? "" : "none";
      });
      noResults.style.display = anyVisible ? "none" : "block";
    }

    searchInput.oninput = applyFilter;
    applyFilter();
  }

  render();

  /* ---------- Flight path from SRT ---------- */

  function parseSrtGps(text) {
    const lat = [...text.matchAll(/latitude\s*:\s*([+-]?\d+\.?\d*)/gi)].map(m => parseFloat(m[1]));
    const lon = [...text.matchAll(/longitude\s*:\s*([+-]?\d+\.?\d*)/gi)].map(m => parseFloat(m[1]));

    if (lat.length && lat.length === lon.length) {
      return lat.map((la, i) => [la, lon[i]]);
    }

    // Fallback: older DJI format, GPS(lon, lat, alt)
    const gps = [...text.matchAll(/GPS\(\s*([+-]?\d+\.?\d*)\s*,\s*([+-]?\d+\.?\d*)/gi)];
    return gps.map(m => [parseFloat(m[2]), parseFloat(m[1])]);
  }

  function handleSrtUpload(input, entryId) {
    const file = input.files[0];
    const statusEl = document.getElementById(`mapstatus-${entryId}`);
    if (!file) return;

    statusEl.textContent = "Reading file…";

    const reader = new FileReader();
    reader.onload = () => {
      const points = parseSrtGps(reader.result);
      if (!points.length) {
        statusEl.textContent = "No GPS data found in that file.";
        return;
      }
      statusEl.textContent = `Loaded ${points.length} GPS points.`;
      drawFlightMap(entryId, points);
    };
    reader.onerror = () => {
      statusEl.textContent = "Couldn't read that file.";
    };
    reader.readAsText(file);
  }

  function drawFlightMap(entryId, points) {
    // keep the map responsive by capping the number of plotted points
    const maxPoints = 500;
    const step = Math.max(1, Math.ceil(points.length / maxPoints));
    const sampled = points.filter((_, i) => i % step === 0);

    const mapEl = document.getElementById(`map-${entryId}`);
    mapEl.style.display = "block";
    mapEl.innerHTML = "";

    const map = L.map(mapEl);

    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri"
    }).addTo(map);

    const line = L.polyline(sampled, { color: "#c98a3e", weight: 3 }).addTo(map);

    L.circleMarker(sampled[0], { radius: 6, color: "#5ec26a", fillColor: "#5ec26a", fillOpacity: 1 })
      .addTo(map).bindTooltip("Start");
    L.circleMarker(sampled[sampled.length - 1], { radius: 6, color: "#e05d5d", fillColor: "#e05d5d", fillOpacity: 1 })
      .addTo(map).bindTooltip("End");

    map.fitBounds(line.getBounds(), { padding: [20, 20] });
  }
</script>

</body>
